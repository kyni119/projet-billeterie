# Les secrets sont lus depuis le fichier .env à la racine (voir .env.example).
services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?définir MYSQL_ROOT_PASSWORD dans .env}
      MYSQL_DATABASE: ${DB_NAME:-billeterie_db}
    # Port MySQL accessible uniquement depuis la machine locale
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./billeterie-backend/sql/billeterie_db.sql:/docker-entrypoint-initdb.d/billeterie_db.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # phpMyAdmin : outil de développement, accessible uniquement en local.
  # Lancer avec : docker compose --profile dev up
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    profiles: ["dev"]
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./billeterie-backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-billeterie_db}
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET dans .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./billet-frontend
      dockerfile: Dockerfile
      args:
        # Vite intègre cette valeur au build : elle doit être passée en build arg
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "5173:80"

volumes:
  mysql-data:

networks:
  default:
    name: app-network
